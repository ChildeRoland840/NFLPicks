<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NFL War Room</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#0A0E17; --panel:#121826; --panel2:#182031; --border:#263149; --line:#1E2740;
    --text:#EAEEF7; --sub:#9AA5BC; --faint:#5C6884; --gold:#E4B24A;
    --lock:#2FBF71; --strong:#59B96A; --lean:#E0A72E; --coin:#D96A5B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
  button{cursor:pointer;font-family:inherit}
  .cond{font-family:'Saira Condensed',sans-serif}
  .tnum{font-variant-numeric:tabular-nums}
  .gold{color:var(--gold)} .sub{color:var(--sub)} .faint{color:var(--faint)}
  .tiny{font-size:11px} .mt6{margin-top:6px}
  ::-webkit-scrollbar{height:8px;width:8px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .wrap{max-width:940px;margin:0 auto;padding:0 14px 64px}
  .top{position:sticky;top:0;z-index:10;background:var(--bg);padding:16px 0 10px;border-bottom:1px solid var(--line)}
  .top .row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .brand{display:flex;align-items:baseline;gap:10px}
  .wm{font-size:26px;font-weight:700;letter-spacing:.5px}
  .controls{display:flex;align-items:center;gap:10px}
  .wk{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:3px 4px}
  .wklabel{min-width:96px;text-align:center;font-size:15px;font-weight:600}
  .ico{background:transparent;border:none;color:var(--sub);padding:4px 8px;font-size:18px;line-height:1;border-radius:6px}
  .ico:disabled{color:var(--faint);opacity:.4;cursor:default}
  .ico:not(:disabled):hover{background:var(--panel2)}
  .tabs{display:flex;gap:4px;margin:14px 0 4px;overflow-x:auto;padding-bottom:1px}
  .tab{flex:1 0 auto;min-width:76px;padding:9px 10px;font-size:14px;font-weight:600;letter-spacing:.4px;color:var(--sub);
       background:transparent;border:1px solid transparent;border-bottom:2px solid var(--line);border-radius:8px 8px 0 0;white-space:nowrap;font-family:'Saira Condensed',sans-serif}
  .tab.on{color:var(--text);background:var(--panel2);border-color:var(--border);border-bottom-color:var(--gold)}
  .logo{position:relative;display:inline-grid;place-items:center;color:#fff;font-family:'Saira Condensed';font-weight:700;flex-shrink:0;overflow:hidden}
  .logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px}
  .spot{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:12px;padding:16px 18px}
  .rowbtn{width:100%;background:transparent;border:none;color:var(--text);text-align:left;padding:10px 12px;display:flex;align-items:center;gap:12px}
  .rowbtn:hover{background:var(--panel2)}
  .chip{display:inline-flex;align-items:center;border-radius:5px;font-weight:700;letter-spacing:.4px;white-space:nowrap;font-family:'Saira Condensed'}
  table{border-collapse:collapse;width:100%;min-width:640px}
  th{font-family:'Saira Condensed';font-size:11px;color:var(--faint);padding:9px 8px;position:sticky;top:0;background:var(--panel)}
  .skel{height:56px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .center{display:grid;place-items:center;min-height:100vh;text-align:center}
  a{color:var(--gold)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ===================== NFL WAR ROOM — vanilla JS, zero dependencies =====================
   Data: ESPN public API (site.api.espn.com). Only outbound call is the game data itself. */

/* ---------- theme ---------- */
var T={bg:"#0A0E17",panel:"#121826",panel2:"#182031",border:"#263149",line:"#1E2740",text:"#EAEEF7",sub:"#9AA5BC",faint:"#5C6884",gold:"#E4B24A"};
var TIERS={lock:{c:"#2FBF71",label:"LOCK"},strong:{c:"#59B96A",label:"STRONG"},lean:{c:"#E0A72E",label:"LEAN"},coin:{c:"#D96A5B",label:"COIN FLIP"}};
function tierFor(prob){var w=Math.max(prob,1-prob);if(w>=0.72)return TIERS.lock;if(w>=0.63)return TIERS.strong;if(w>=0.56)return TIERS.lean;return TIERS.coin;}

/* ---------- math ---------- */
function clamp(x,lo,hi){return Math.max(lo,Math.min(hi,x));}
function erf(x){var t=1/(1+0.3275911*Math.abs(x));var y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return x>=0?y:-y;}
function normCdf(x){return 0.5*(1+erf(x/Math.SQRT2));}
function probFromMargin(m){return clamp(normCdf(m/13.5),0.02,0.98);}
var HFA=48,HFA_PTS=1.9;
function eloProb(rH,rA){return 1/(1+Math.pow(10,((rA)-(rH+HFA))/400));}
function log5(pa,pb){var d=pa+pb-2*pa*pb;if(Math.abs(d)<1e-9)return 0.5;return clamp((pa-pa*pb)/d,0.02,0.98);}
function mlToProb(ml){if(!isFinite(ml))return null;return ml<0?-ml/(-ml+100):100/(ml+100);}
function pyth(pf,pa){return(pf+pa<=0)?0.5:Math.pow(pf,2.37)/(Math.pow(pf,2.37)+Math.pow(pa,2.37));}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* ---------- ESPN fetch ---------- */
var API="https://site.api.espn.com/apis/site/v2/sports/football/nfl";
function j(url){return fetch(url).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});}
function fetchWeek(year,seasontype,week){return j(API+"/scoreboard?year="+year+"&seasontype="+seasontype+"&week="+week).then(function(d){return d.events||[];}).catch(function(){return[];});}
function fetchSummaryProb(id){return j(API+"/summary?event="+id).then(function(d){var g=d&&d.predictor&&d.predictor.homeTeam&&d.predictor.homeTeam.gameProjection;var v=parseFloat(g);return isFinite(v)?v/100:null;}).catch(function(){return null;});}
function runTasks(tasks,onProg,concurrency){
  concurrency=concurrency||8;var results=new Array(tasks.length),i=0,done=0;
  function worker(){
    if(i>=tasks.length)return Promise.resolve();
    var idx=i++;return Promise.resolve(tasks[idx]()).then(function(r){results[idx]=r;done++;if(onProg)onProg(done,tasks.length);return worker();});
  }
  var starters=[];for(var k=0;k<Math.min(concurrency,tasks.length);k++)starters.push(worker());
  return Promise.all(starters).then(function(){return results;});
}

/* ---------- parse a scoreboard event ---------- */
function parseEvent(ev){
  var comp=ev.competitions&&ev.competitions[0];if(!comp)return null;
  var cs=comp.competitors||[];
  var home=cs.filter(function(c){return c.homeAway==="home";})[0];
  var away=cs.filter(function(c){return c.homeAway==="away";})[0];
  if(!home||!away)return null;
  function info(c){var tm=c.team||{};return{id:tm.id,abbr:tm.abbreviation||"?",name:tm.shortDisplayName||tm.displayName||"?",full:tm.displayName||"",logo:tm.logo||(tm.logos&&tm.logos[0]&&tm.logos[0].href)||"",color:tm.color?"#"+tm.color:T.faint,score:c.score!=null?parseInt(c.score,10):null,winner:!!c.winner};}
  var H=info(home),A=info(away);
  var status=(comp.status&&comp.status.type)||(ev.status&&ev.status.type)||{};
  var market=null,spreadTxt=null,ou=null,vegasHomeMargin=null;
  var o=comp.odds&&comp.odds[0];
  if(o){
    ou=o.overUnder!=null?o.overUnder:null;
    spreadTxt=o.details||(isFinite(o.spread)?String(o.spread):null);
    if(o.details){var m=o.details.match(/([A-Z]{2,4})\s+(-?\d+(?:\.\d+)?)/);if(m){var favBy=Math.abs(parseFloat(m[2]));vegasHomeMargin=m[1]===H.abbr?favBy:-favBy;}}
    if(vegasHomeMargin==null&&isFinite(o.spread))vegasHomeMargin=-o.spread;
    var mlH=o.homeTeamOdds&&o.homeTeamOdds.moneyLine,mlA=o.awayTeamOdds&&o.awayTeamOdds.moneyLine;
    var pH=mlToProb(mlH),pA=mlToProb(mlA);
    if(pH!=null&&pA!=null&&pH+pA>0)market=pH/(pH+pA);
    else if(vegasHomeMargin!=null)market=probFromMargin(vegasHomeMargin);
  }
  return{id:ev.id,date:ev.date,home:H,away:A,completed:!!status.completed,state:status.state,market:market,spreadTxt:spreadTxt,ou:ou,vegasHomeMargin:vegasHomeMargin};
}

/* ---------- rating engine ---------- */
function newAcc(){return{w:0,l:0,pf:0,pa:0,games:0,marginSum:0,oppEloSum:0};}
var MODELS=[{key:"market",label:"Vegas Line",short:"VEG"},{key:"espn",label:"ESPN FPI",short:"FPI"},{key:"elo",label:"Elo Rating",short:"ELO"},{key:"net",label:"Net Rating",short:"NET"},{key:"pyth",label:"Pythagorean",short:"PYT"},{key:"form",label:"Recent Form",short:"FRM"},{key:"record",label:"Win %",short:"W-L"}];
var DEFAULT_W={market:0.09,espn:0.08,elo:0.075,net:0.055,pyth:0.05,form:0.035,record:0.025};

function replay(games,elo,lastAcc,curAcc,formMap,season,backtest,oddsForBacktest){
  var acc=season==="cur"?curAcc:lastAcc;
  for(var gi=0;gi<games.length;gi++){
    var g=games[gi],hId=g.home.id,aId=g.away.id;
    if(elo[hId]==null)elo[hId]=1500;if(elo[aId]==null)elo[aId]=1500;
    var rH=elo[hId],rA=elo[aId];
    if(backtest){
      var la=acc[hId],lb=acc[aId],winnerHome=g.hs>g.as,bp={};
      var setp=function(key,p){if(p!=null&&p!==0.5)bp[key]=p;};
      setp("elo",eloProb(rH,rA));
      if(la&&lb&&la.games>=1&&lb.games>=1){
        var rp=function(x){return x.games?x.w/x.games:0.5;};
        setp("record",clamp(log5(rp(la),rp(lb))+0.03,0.02,0.98));
        var py=function(x){return x.games?pyth(x.pf/x.games,x.pa/x.games):0.5;};
        setp("pyth",clamp(log5(py(la),py(lb))+0.03,0.02,0.98));
        var net=function(x){return x.games?x.marginSum/x.games+(x.oppEloSum/x.games-1500)/25:0;};
        setp("net",probFromMargin(net(la)-net(lb)+HFA_PTS));
        var fm=function(id){var arr=(formMap[id]||[]).slice(-4);return arr.length?arr.filter(Boolean).length/arr.length:0.5;};
        setp("form",clamp(log5(fm(hId),fm(aId))+0.02,0.02,0.98));
      }
      if(oddsForBacktest&&g.marketHomeProb!=null)setp("market",g.marketHomeProb);
      for(var k in bp){if(!backtest[k])backtest[k]={correct:0,total:0};backtest[k].total++;if((bp[k]>0.5)===winnerHome)backtest[k].correct++;}
      var num=0,den=0;for(var k2 in bp){num+=DEFAULT_W[k2]*bp[k2];den+=DEFAULT_W[k2];}
      if(den>0){var ep=num/den,ok=(ep>0.5)===winnerHome;
        if(!backtest.ensemble)backtest.ensemble={correct:0,total:0};backtest.ensemble.total++;if(ok)backtest.ensemble.correct++;
        var wk=g.ord;if(!backtest.byWeek)backtest.byWeek={};if(!backtest.byWeek[wk])backtest.byWeek[wk]={correct:0,total:0};backtest.byWeek[wk].total++;if(ok)backtest.byWeek[wk].correct++;
      }
    }
    var exp=eloProb(rH,rA),margin=g.hs-g.as,resHome=margin>0?1:(margin<0?0:0.5);
    var adjH=rH+HFA,adjA=rA,eloDiffWinner=resHome===1?adjH-adjA:adjA-adjH;
    var movMult=Math.log(Math.abs(margin)+1)*(2.2/(eloDiffWinner*0.001+2.2)),K=20;
    var delta=K*movMult*(resHome-exp);elo[hId]=rH+delta;elo[aId]=rA-delta;
    var pairs=[[hId,aId,g.hs,g.as,rA],[aId,hId,g.as,g.hs,rH]];
    for(var pi=0;pi<pairs.length;pi++){
      var t=pairs[pi][0],sf=pairs[pi][2],sa=pairs[pi][3],oppElo=pairs[pi][4];
      if(!acc[t])acc[t]=newAcc();var a=acc[t],won=sf>sa;
      a.games++;a.pf+=sf;a.pa+=sa;a.marginSum+=sf-sa;a.oppEloSum+=oppElo;
      if(won)a.w++;else if(sf<sa)a.l++;
      if(!formMap[t])formMap[t]=[];formMap[t].push(won?1:0);
    }
  }
}
function blend(cur,last,pickCur,pickLast,neutral){
  var cg=cur?cur.games:0;
  if(cg>=4)return pickCur(cur);
  var lastVal=last&&last.games?pickLast(last):neutral;
  if(cg>0){var wc=cg/4;return wc*pickCur(cur)+(1-wc)*lastVal;}
  return lastVal;
}
function buildEffStats(meta,lastAcc,curAcc,formMap){
  var eff={};
  Object.keys(meta).forEach(function(id){
    var cur=curAcc[id],last=lastAcc[id];
    var recordPct=blend(cur,last,function(x){return x.w/x.games;},function(x){return x.w/x.games;},0.5);
    var avgPf=blend(cur,last,function(x){return x.pf/x.games;},function(x){return x.pf/x.games;},21);
    var avgPa=blend(cur,last,function(x){return x.pa/x.games;},function(x){return x.pa/x.games;},21);
    var avgMargin=blend(cur,last,function(x){return x.marginSum/x.games;},function(x){return x.marginSum/x.games;},0);
    var avgOpp=blend(cur,last,function(x){return x.oppEloSum/x.games;},function(x){return x.oppEloSum/x.games;},1500);
    var arr=(formMap[id]||[]).slice(-4);
    var form=arr.length?arr.filter(Boolean).length/arr.length:0.5;
    eff[id]={recordPct:recordPct,pyth:pyth(avgPf,avgPa),form:form,net:avgMargin+(avgOpp-1500)/25};
  });
  return eff;
}
function computeWeights(backtest){
  var w={},bt={};
  MODELS.forEach(function(m){var b=backtest[m.key];if(b&&b.total>=25){var acc=b.correct/b.total;bt[m.key]=acc;w[m.key]=Math.max(0.01,acc-0.5);}else{w[m.key]=DEFAULT_W[m.key];}});
  if(!(backtest.espn&&backtest.espn.total>=25)){var strong=Math.max(w.elo,w.market||0);w.espn=Math.max(w.espn,strong*0.95);}
  return{weights:w,acc:bt};
}
function predictMatchup(engine,ev){
  var elo=engine.elo,eff=engine.eff,weights=engine.weights;
  var hId=ev.home.id,aId=ev.away.id,rH=elo[hId]!=null?elo[hId]:1500,rA=elo[aId]!=null?elo[aId]:1500;
  var eh=eff[hId]||{recordPct:0.5,pyth:0.5,form:0.5,net:0},ea=eff[aId]||{recordPct:0.5,pyth:0.5,form:0.5,net:0};
  var probs={};
  probs.elo=eloProb(rH,rA);
  probs.record=clamp(log5(eh.recordPct,ea.recordPct)+0.03,0.02,0.98);
  probs.pyth=clamp(log5(eh.pyth,ea.pyth)+0.03,0.02,0.98);
  probs.form=clamp(log5(eh.form,ea.form)+0.02,0.02,0.98);
  probs.net=probFromMargin(eh.net-ea.net+HFA_PTS);
  if(ev.market!=null)probs.market=ev.market;
  if(ev.espn!=null)probs.espn=ev.espn;
  var num=0,den=0;MODELS.forEach(function(m){if(probs[m.key]!=null){num+=weights[m.key]*probs[m.key];den+=weights[m.key];}});
  var ensemble=den>0?num/den:0.5;
  var agree=MODELS.filter(function(m){return probs[m.key]!=null&&(probs[m.key]>0.5)===(ensemble>0.5);}).length;
  var total=MODELS.filter(function(m){return probs[m.key]!=null;}).length;
  var modelSpreadHome=((rH+HFA-rA)/25+(eh.net-ea.net+HFA_PTS))/2;
  var ats=null;
  if(ev.vegasHomeMargin!=null){var edge=modelSpreadHome-ev.vegasHomeMargin,sideIsHome=edge>0;ats={modelSpreadHome:modelSpreadHome,vegasHomeMargin:ev.vegasHomeMargin,edge:edge,side:sideIsHome?ev.home:ev.away,sideIsHome:sideIsHome};}
  var favIsHome=ev.market!=null?ev.market>=0.5:ensemble>=0.5,dogIsHome=!favIsHome;
  var dogTeam=dogIsHome?ev.home:ev.away,favTeam=dogIsHome?ev.away:ev.home;
  var dogProb=dogIsHome?ensemble:1-ensemble,modelPicksDog=(ensemble>=0.5)===dogIsHome;
  var dogForm=dogIsHome?eh.form:ea.form,favForm=dogIsHome?ea.form:eh.form;
  var signals=[],upsetScore=dogProb;
  if(modelPicksDog){upsetScore+=0.10;signals.push("Consensus takes the underdog outright");}
  if(dogForm-favForm>=0.25){upsetScore+=0.05;signals.push("Underdog is in hotter recent form");}
  if(total>=3&&agree<=Math.ceil(total*0.6)){upsetScore+=0.05;signals.push("The models are split on this one");}
  if(ats&&ats.sideIsHome===dogIsHome&&Math.abs(ats.edge)>=2.5){upsetScore+=0.05;signals.push("Model sees "+Math.abs(ats.edge).toFixed(1)+" pts of spread value on the dog");}
  var upsetTier=null;if(ev.market!=null||total>=3){if(modelPicksDog)upsetTier="pick";else if(dogProb>=0.40)upsetTier="alert";}
  var out={};for(var kk in ev)out[kk]=ev[kk];
  out.probs=probs;out.ensemble=ensemble;out.agree=agree;out.totalModels=total;out.ats=ats;out.dogTeam=dogTeam;out.favTeam=favTeam;out.dogProb=dogProb;out.dogIsHome=dogIsHome;out.modelPicksDog=modelPicksDog;out.upsetScore=upsetScore;out.signals=signals;out.upsetTier=upsetTier;
  return out;
}

/* ---------- helpers for render ---------- */
function fmtKick(iso){try{var d=new Date(iso);return d.toLocaleDateString(undefined,{weekday:"short"})+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}catch(e){return"";}}
function fmtSpread(m){if(m==null||isNaN(m)||Math.abs(m)<0.05)return"PK";return m>0?"-"+m.toFixed(1):"+"+(-m).toFixed(1);}
function pickSide(g){var homePick=g.ensemble>=0.5;return{team:homePick?g.home:g.away,opp:homePick?g.away:g.home,prob:homePick?g.ensemble:1-g.ensemble,homePick:homePick};}
function logoHTML(t,size){var ab=esc((t.abbr||"?").slice(0,3)),col=t.color||T.faint;return '<span class="logo" style="width:'+size+'px;height:'+size+'px;background:'+col+';border-radius:'+(size/4)+'px;font-size:'+(size*0.34)+'px">'+ab+(t.logo?'<img src="'+esc(t.logo)+'" alt="" onerror="this.remove()">':"")+'</span>';}
function upsetChip(tier,small){if(!tier)return"";var isPick=tier==="pick",c=isPick?TIERS.coin.c:TIERS.lean.c;var pad=small?"0 5px":"1px 8px",fs=small?9.5:11;return '<span class="chip" style="background:'+c+'22;color:'+c+';border:1px solid '+c+'66;padding:'+pad+';font-size:'+fs+'px">'+(isPick?"UPSET PICK":"UPSET WATCH")+'</span>';}

/* ---------- state ---------- */
var STATE={status:"loading",view:"slate",week:1,year:null,games:[],expandedId:null,loadingWeek:false,showHow:false,prog:{done:0,total:1,label:"Waking up the war room"},err:""};
var ENGINE=null;
var appEl=document.getElementById("app");
var TABS=[["slate","Slate"],["upsets","Upsets"],["rankings","Rankings"],["matrix","Matrix"],["record","Record"]];

/* ---------- views ---------- */
function topBar(){
  return '<header class="top"><div class="row">'
    +'<div class="brand"><span class="cond wm">WAR <span class="gold">ROOM</span></span><span class="sub tiny">NFL pick\'em intelligence</span></div>'
    +'<div class="controls"><div class="wk">'
    +'<button class="ico" data-act="week" data-dir="-1"'+(STATE.week<=1||STATE.loadingWeek?" disabled":"")+'>&lsaquo;</button>'
    +'<span class="cond wklabel">WEEK '+STATE.week+' &middot; '+(STATE.year||"")+'</span>'
    +'<button class="ico" data-act="week" data-dir="1"'+(STATE.week>=18||STATE.loadingWeek?" disabled":"")+'>&rsaquo;</button>'
    +'</div><button class="ico" data-act="refresh" title="Rebuild ratings">&#8635;</button></div></div>'
    +(ENGINE&&!ENGINE.histOdds?'<div class="tiny faint mt6">Historical betting lines were sparse — the Vegas model uses live lines only.</div>':"")
    +'</header>';
}
function tabsHTML(){return '<div class="tabs">'+TABS.map(function(t){return '<button class="tab '+(STATE.view===t[0]?"on":"")+'" data-act="tab" data-tab="'+t[0]+'">'+t[1]+'</button>';}).join("")+'</div>';}
function skeleton(){var s="";for(var i=0;i<6;i++)s+='<div class="skel" style="opacity:'+(1-i*0.12)+'"></div>';return '<div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">'+s+'</div>';}
function emptyMsg(m){return '<div style="margin-top:30px;text-align:center;color:'+T.sub+';font-size:13px;padding:20px">'+esc(m)+'</div>';}

function lockSpotlight(g){
  var ps=pickSide(g),tier=tierFor(g.ensemble);
  return '<div class="spot" style="border-left:3px solid '+tier.c+';margin-top:14px">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="cond gold" style="font-size:13px;letter-spacing:1px;font-weight:700">&#9889; BEST BET OF THE WEEK</span></div>'
    +'<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">'+logoHTML(ps.team,44)

function buildEngine(){
  STATE.status="loading";STATE.err="";STATE.prog={done:0,total:1,label:"Finding the current week"};render();
  return j(API+"/scoreboard").then(function(bare){
    var curYear=(bare.season&&bare.season.year)||new Date().getFullYear();
    var curType=(bare.season&&bare.season.type)||2;
    var curWeek=(bare.week&&bare.week.number)||1;
    var lastYear=curYear-1;
    var defaultWeek=curType===2?curWeek:1;
    var completedCurWeeks=curType===2?Math.max(0,curWeek):0;
    STATE.year=curYear;STATE.week=defaultWeek;
    var tasks=[],tags=[];
    for(var wk=1;wk<=18;wk++){(function(wk){tasks.push(function(){return fetchWeek(lastYear,2,wk);});})(wk);tags.push({season:"last",ord:wk});}
    for(var wp=1;wp<=5;wp++){(function(wp){tasks.push(function(){return fetchWeek(lastYear,3,wp);});})(wp);tags.push({season:"last",ord:100+wp});}
    for(var wc=1;wc<=completedCurWeeks;wc++){(function(wc){tasks.push(function(){return fetchWeek(curYear,2,wc);});})(wc);tags.push({season:"cur",ord:wc});}
    STATE.prog={done:0,total:tasks.length,label:"Pulling game history"};render();
    return runTasks(tasks,function(d,t){STATE.prog={done:d,total:t,label:"Pulling game history"};render();}).then(function(res){
      var meta={},lastGames=[],curGames=[],histOdds=0;
      res.forEach(function(events,idx){
        var tag=tags[idx];
        (events||[]).forEach(function(ev){
          var p=parseEvent(ev);if(!p)return;
          [p.home,p.away].forEach(function(tm){if(tm.id&&!meta[tm.id])meta[tm.id]={abbr:tm.abbr,name:tm.name,full:tm.full,logo:tm.logo,color:tm.color};});
          if(!p.completed||p.home.score==null||p.away.score==null)return;
          var rec={date:p.date,home:p.home,away:p.away,hs:p.home.score,as:p.away.score,marketHomeProb:p.market,ord:tag.ord};
          if(p.market!=null)histOdds++;
          (tag.season==="last"?lastGames:curGames).push(rec);
        });
      });
      function byDate(a,b){return new Date(a.date)-new Date(b.date)||a.ord-b.ord;}
      lastGames.sort(byDate);curGames.sort(byDate);
      if(Object.keys(meta).length<16)throw new Error("Couldn't load enough team data from ESPN. It may be rate-limiting — try again in a moment.");
      var elo={},lastAcc={},curAcc={},formMap={},backtest={};
      replay(lastGames,elo,lastAcc,curAcc,formMap,"last",backtest,histOdds>40);
      Object.keys(elo).forEach(function(kk){elo[kk]=1500+(elo[kk]-1500)*0.75;});
      var curBt={};replay(curGames,elo,lastAcc,curAcc,formMap,"cur",curBt,histOdds>40);
      var eff=buildEffStats(meta,lastAcc,curAcc,formMap);
      var cw=computeWeights(backtest);
      function recFor(id){var c=curAcc[id],l=lastAcc[id];if(c&&c.games)return{w:c.w,l:c.l,tag:""};if(l&&l.games)return{w:l.w,l:l.l,tag:"'"+String(lastYear).slice(2)};return{w:0,l:0,tag:""};}
      ENGINE={curYear:curYear,lastYear:lastYear,elo:elo,eff:eff,weights:cw.weights,acc:cw.acc,meta:meta,backtest:backtest,curBt:curBt,formMap:formMap,recFor:recFor,histOdds:histOdds>40};
      STATE.status="ready";render();
      return loadWeek(defaultWeek,curYear);
    });
  }).catch(function(e){STATE.err=(e&&e.message)||"Something went wrong talking to ESPN.";STATE.status="error";render();});
}
function loadWeek(wk,yr){
  if(!ENGINE)return Promise.resolve();
  var useYear=yr||ENGINE.curYear;STATE.loadingWeek=true;render();
  return fetchWeek(useYear,2,wk).then(function(events){
    var parsed=events.map(parseEvent).filter(Boolean);
    return runTasks(parsed.map(function(p){return function(){return fetchSummaryProb(p.id);};}),null,6).then(function(espnProbs){
      parsed.forEach(function(p,i){p.espn=espnProbs[i];});
      var preds=parsed.map(function(p){return predictMatchup(ENGINE,p);});
      preds.sort(function(a,b){return Math.max(b.ensemble,1-b.ensemble)-Math.max(a.ensemble,1-a.ensemble);});
      STATE.games=preds;STATE.expandedId=null;STATE.loadingWeek=false;render();
    });
  }).catch(function(){STATE.games=[];STATE.loadingWeek=false;render();});
}

/* ---------- events ---------- */
appEl.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.getAttribute("data-act");
  if(act==="tab"){STATE.view=el.getAttribute("data-tab");render();}
  else if(act==="week"){var dir=parseInt(el.getAttribute("data-dir"),10);var nw=STATE.week+dir;if(nw<1||nw>18||STATE.loadingWeek)return;STATE.week=nw;loadWeek(nw,STATE.year);}
  else if(act==="refresh"){buildEngine();}
  else if(act==="expand"){var id=el.getAttribute("data-id");STATE.expandedId=STATE.expandedId===id?null:id;render();}
  else if(act==="how"){STATE.showHow=!STATE.showHow;render();}
});

/* ---------- go ---------- */
render();
buildEngine();
</script>
